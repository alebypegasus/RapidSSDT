name: Build Releases

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact_name: RapidSSDT-macOS
            output_path: build/macos/Build/Products/Release/rapidssdt.app
          - os: windows-latest
            target: windows
            artifact_name: RapidSSDT-Windows
            output_path: build/windows/x64/runner/Release/*
          - os: ubuntu-latest
            target: linux
            artifact_name: RapidSSDT-Linux
            output_path: build/linux/x64/release/bundle/*

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libbz2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop Support
        run: |
          flutter config --enable-macos-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Application
        run: flutter build ${{ matrix.target }} --release --no-tree-shake-icons

      - name: Archive macOS App
        if: matrix.target == 'macos'
        run: |
          cd build/macos/Build/Products/Release/
          zip -r rapidssdt-macos.zip rapidssdt.app
        # This zips the .app folder to preserve permissions on macOS

      - name: Upload macOS Artifact
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/macos/Build/Products/Release/rapidssdt-macos.zip

      - name: Upload Windows/Linux Artifact
        if: matrix.target != 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
