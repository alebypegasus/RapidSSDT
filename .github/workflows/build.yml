name: Build Releases

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact_name: RapidSSDT-macOS
            output_path: build/macos/Build/Products/Release/rapidssdt.app
          - os: windows-latest
            target: windows
            artifact_name: RapidSSDT-Windows
            output_path: build/windows/x64/runner/Release/*
          - os: ubuntu-latest
            target: linux
            artifact_name: RapidSSDT-Linux
            output_path: build/linux/x64/release/bundle/*

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libbz2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop Support
        run: |
          flutter config --enable-macos-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Application
        run: flutter build ${{ matrix.target }} --release --no-tree-shake-icons

      - name: Archive macOS App
        if: matrix.target == 'macos'
        run: |
          cd build/macos/Build/Products/Release/
          zip -r rapidssdt-macos.zip rapidssdt.app

      - name: Archive Windows App
        if: matrix.target == 'windows'
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath rapidssdt-windows.zip

      - name: Archive Linux App
        if: matrix.target == 'linux'
        run: |
          cd build/linux/x64/release/bundle/
          zip -r ../../../../../rapidssdt-linux.zip .

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "latest"
          name: "Latest Build"
          body: "Automated build of RapidSSDT from the main branch."
          prerelease: true
          files: |
            build/macos/Build/Products/Release/rapidssdt-macos.zip
            rapidssdt-windows.zip
            rapidssdt-linux.zip
